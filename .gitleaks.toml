# Gate 2.5 secret scan config: generated build output is excluded (gitleaks would
# otherwise flag the Firebase API key echoed into lint/logcat artifacts).
# app/google-services.json is local-only — required on disk for the google-services
# plugin, but untracked + gitignored and purged from git history 2026-09-16. Its
# Android client key is package+SHA-restricted and ships in the APK by design.
# .cache/ holds gitignored, regenerable tool state: the web-search skill's result
# cache (its SHA-256 "key" field trips generic-api-key) and the localhost
# domainusage test server's self-signed cert (generated by scripts/domainusage-test-server.py).
title = "MyExodus gitleaks config"

[extend]
useDefault = true

[allowlist]
paths = [
  '''app/build/''',
  '''app/google-services.json''',
  '''.cache/''',
]
