name: Verify

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - '**.md'
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # Firebase client config is untracked by policy; it is not secret (it ships in every APK).
      - name: Provide Firebase config
        run: echo "$FIREBASE_CONFIG_B64" | base64 -d > app/google-services.json
        env:
          FIREBASE_CONFIG_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}

      - name: JVM tests
        run: ./gradlew :app:testDebugUnitTest

      # ADR #208: lint runs alone, never in the same invocation as tests.
      - name: Android lint
        run: ./gradlew :app:lintDebug
